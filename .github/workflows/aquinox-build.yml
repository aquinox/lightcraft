# Builds of this fork (aquinox/lightcraft), not meant for upstream.
# Builds LightCraft for Windows x64 (portable zip) and Linux x86_64 (AppImage and tar.gz) on every push
# to an `aquinox-*` branch and uploads them as artifacts. With "[release]" in the commit message they are
# also published together as a pre-release on the fork's Releases page; its title is the first line of
# BUILD-NOTES.txt and its notes are that file.
name: Windows and Linux builds (fork)

on:
  push:
    branches: ["aquinox-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquinox-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: aquinox-windows-x64

      - name: Fonts (craft-fonts, as the official builds use)
        shell: pwsh
        run: |
          . packaging/windows/fonts.ps1
          Initialize-CraftFonts $PWD.Path
          "CRAFT_FONTS_DIR=$env:CRAFT_FONTS_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CRAFT_FONTS_REQUIRED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (release, static C runtime)
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = '-C target-feature=+crt-static'
          $env:LIGHTCRAFT_BUILD_SHA = (git rev-parse HEAD)
          $env:LIGHTCRAFT_BUILD_DATE = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          cargo build --release --locked -p lightcraft -p lightcraft-cli --features lightcraft/heif,lightcraft-cli/heif --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed ($LASTEXITCODE)" }

      - name: Portable zip
        id: zip
        shell: pwsh
        run: |
          $short = (git rev-parse --short=8 HEAD)
          $variant = $env:GITHUB_REF_NAME -replace '^aquinox-', ''
          $name = "lightcraft-$variant-$short-windows-x64-portable"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bin = 'target\x86_64-pc-windows-msvc\release'
          Copy-Item (Join-Path $bin 'lightcraft.exe'), (Join-Path $bin 'lightcraft-cli.exe') $stage
          Copy-Item NOTICE, LICENSE-MIT, LICENSE-APACHE $stage
          # the embedded fonts' OFL texts, as the official packages ship them
          . packaging/windows/font-licences.ps1
          Write-FontLicences (Join-Path $stage 'FONT-LICENCES.txt') (Join-Path $PWD 'assets\fonts\OFL-Inter.txt') $env:CRAFT_FONTS_DIR
          if (Test-Path BUILD-NOTES.txt) { Copy-Item BUILD-NOTES.txt (Join-Path $stage 'README-BUILD.txt') }
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Compress-Archive -Path $stage -DestinationPath (Join-Path $out "$name.zip")
          "out=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ steps.zip.outputs.out }}
          retention-days: 30

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libdbus-1-dev \
            desktop-file-utils zsync

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: aquinox-linux-x64

      - name: Build and package (AppImage and tar.gz)
        env:
          DIST: ${{ runner.temp }}/dist
        run: packaging/linux/package.sh --formats "appimage tar"

      - name: Rename files
        id: files
        run: |
          short=$(git rev-parse --short=8 HEAD)
          variant="${GITHUB_REF_NAME#aquinox-}"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          for f in "$RUNNER_TEMP"/dist/*.AppImage "$RUNNER_TEMP"/dist/*.tar.gz; do
            [ -e "$f" ] || continue
            ext="${f##*.}"; [ "$ext" = gz ] && ext=tar.gz
            cp "$f" "$out/lightcraft-$variant-$short-linux-x86_64.$ext"
          done
          ls -l "$out"
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ${{ steps.files.outputs.out }}
          retention-days: 30

  release:
    if: contains(github.event.head_commit.message, '[release]')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short=8 HEAD)
          tag="${GITHUB_REF_NAME#aquinox-}-$short"
          ls -l artifacts
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          title="LightCraft, unofficial build"
          notes=(--notes "Unofficial build of LightCraft.")
          if [ -f BUILD-NOTES.txt ]; then
            title="$(head -n1 BUILD-NOTES.txt)"
            notes=(--notes-file BUILD-NOTES.txt)
          fi
          gh release create "$tag" artifacts/* --prerelease --target "$GITHUB_SHA" --title "$title ($tag)" "${notes[@]}"
